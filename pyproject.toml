
[project]
name = "prodml"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "scikit-learn>=1.9.1",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "seaborn>=0.13.2",
    "skl2onnx>=1.20.0",
    "onnxruntime>=1.31.0",
    "litestar>=2.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "httpx",
    "pre-commit",
    "ipykernel",
]

[project.scripts]
prodml-train = "prodml.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
